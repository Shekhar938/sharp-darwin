function importProjectJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (data.plot) plot = data.plot;
            if (data.floorConfig) floorConfig = data.floorConfig;
            if (data.floors) floors = data.floors;
            if (data.floorFixed) floorFixed = data.floorFixed;
            if (data.floorWalls) floorWalls = data.floorWalls;

            BW = plot.w; BH = plot.h;
            SVG_W = BW * S + PAD_LEFT + PAD_RIGHT; SVG_H = BH * S + PAD_TOP + PAD_BOTTOM;
            curFloor = floorConfig[0] ? floorConfig[0].id : 'ground';

            saveData();
            renderFloorTabs();
            render();
            if (is3DMode) build3DScene();
            alert('🎉 Project layout restored successfully from your backup file!');
        } catch (err) {
            alert('❌ Failed to read project JSON file: ' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

// ======================== INIT UI ========================
function saveData() {
    if (typeof localStorage !== 'undefined') {
        localStorage.setItem('fp_data_v4_backup1', JSON.stringify({ floors, plot, floorFixed, floorWalls, floorConfig }));
    }
}

function loadState() {
    try {
        const saved = localStorage.getItem('fp_data_v4_backup1');
        if (saved) {
            const data = JSON.parse(saved);
            if (data.plot) plot = data.plot;
            if (data.floorConfig) floorConfig = data.floorConfig;
            if (data.floorFixed) {
                floorFixed = data.floorFixed;
            } else if (data.fixedFeatures && Array.isArray(data.fixedFeatures)) {
                // Migrate old saves: put old global fixedFeatures into ground floor
                floorFixed['ground'] = data.fixedFeatures;
            }
            // Support old saves that had a single global `walls` array (migrate to per-floor)
            if (data.floorWalls) {
                floorWalls = data.floorWalls;
            } else if (data.walls && Array.isArray(data.walls) && data.walls.length > 0) {
                floorWalls[curFloor] = data.walls; // migrate old single-floor walls to current floor
            }
            if (data.floors) floors = data.floors;
            
            BW = plot.w; BH = plot.h; 
            SVG_W = BW * S + PAD_LEFT + PAD_RIGHT; SVG_H = BH * S + PAD_TOP + PAD_BOTTOM;
        }
    } catch (e) {
        console.error('Failed to load state', e);
    }
}

function initUI() {
    loadState();
    renderFloorTabs();

    const toolGrid = document.getElementById('toolGrid');
    TOOLS.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'tool-btn' + (t.id===curTool?' active':'');
        btn.dataset.tool = t.id;
        btn.innerHTML = `<span class="tool-icon">${t.icon}</span>${t.label}`;
        btn.onclick = () => setTool(t.id);
        toolGrid.appendChild(btn);
    });

    const palEl = document.getElementById('paletteList');
    Object.entries(PRESETS).forEach(([key, p]) => {
        const btn = document.createElement('button');
        btn.className = 'palette-item';
        btn.dataset.type = key;
        btn.innerHTML = `<span class="palette-icon">${p.icon}</span><span>${p.name}</span><span class="palette-color" style="background:${p.color}"></span>`;
        btn.onclick = () => setAddType(key);
        palEl.appendChild(btn);
    });

    const doorPal = document.getElementById('doorPresetsList');
    if (doorPal) {
        Object.entries(DOOR_PRESETS).forEach(([key, p]) => {
            const btn = document.createElement('button');
            btn.className = 'palette-item';
            btn.innerHTML = `<span class="palette-icon">${p.icon}</span><span>${p.name}</span>`;
            btn.onclick = () => {
                const newDoor = { id:gid(), isDoor:p.isDoor, isWin:p.isWin, type: p.isDoor ? 'door' : 'window', name:p.name, x:0, y:0, w:p.w, h:p.h, color:p.color, icon:p.icon, desc:'Door/Window' };
                curFixed().push(newDoor);
                selFixed = newDoor.id; selRoom = null;
                pushHistory(); render(); updateProps();
                if(is3DMode) build3DScene();
            };
            doorPal.appendChild(btn);
        });
    }

    const fixedPal = document.getElementById('fixedPresetsList');
    Object.entries(FIXED_PRESETS).forEach(([key, p]) => {
        const btn = document.createElement('button');
        btn.className = 'palette-item';
        btn.innerHTML = `<span class="palette-icon">${p.icon}</span><span>${p.name}</span>`;
        btn.onclick = () => {
            const newFixed = { id:gid(), name:p.name, x:0, y:0, w:p.w, h:p.h, color:p.color, icon:p.icon, desc:'Fixed Structure' };
            curFixed().push(newFixed);
            selFixed = newFixed.id; selRoom = null;
            pushHistory(); render(); updateProps();
            if(is3DMode) build3DScene();
        };
        fixedPal.appendChild(btn);
    });

    const layersEl = document.getElementById('layersList');
    if (layersEl) {
        layersEl.innerHTML = '';
        LAYER_DEFS.forEach(l => {
            const isON = (layers[l.id] !== undefined) ? layers[l.id] : l.on;
            const row = document.createElement('div');
            row.className = 'layer-row';
            row.innerHTML = `<div class="layer-toggle${isON ? ' on' : ''}" data-layer="${l.id}" onclick="toggleLayer('${l.id}')"><div class="knob"></div></div><span class="layer-name"><span class="layer-dot" style="background:${l.dot}"></span>${l.label}</span>`;
            layersEl.appendChild(row);
        });
    }

    // Mouse Wheel Zoom Listener
    const wrap2D = document.getElementById('canvas2DWrap');
    if (wrap2D) {
        wrap2D.addEventListener('wheel', (e) => {
            if (e.ctrlKey || e.metaKey || curTool === 'select' || curTool === 'move') {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.1 : -0.1;
                zoomStep(delta);
            }
        }, { passive: false });
    }

    pushHistory();
    updateHistBtns();
    render();
    initCollapsibleCards();
}

function initCollapsibleCards() {
    document.querySelectorAll('.panel-card').forEach(card => {
        const title = card.querySelector('.panel-title');
        if (!title) return;

        let icon = title.querySelector('.card-toggle-icon');
        if (!icon) {
            icon = document.createElement('span');
            icon.className = 'card-toggle-icon';
            icon.innerHTML = '▼';
            title.appendChild(icon);
        }

        let body = card.querySelector('.card-body');
        if (!body) {
            body = document.createElement('div');
            body.className = 'card-body';
            const children = Array.from(card.childNodes).filter(node => node !== title && node !== body);
            children.forEach(child => body.appendChild(child));
            card.appendChild(body);
        }

        title.onclick = (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            card.classList.toggle('collapsed');
        };
    });
}

// ======================== THREE.JS 3D ENGINE ========================
let is3DMode = false;
let isExploded = false;
let isAutoRotate = false;
let wallHeight3D = 9;
let explodeAmount = 0;
let targetExplode = 0;
let scene3D, camera3D, renderer3D, controls3D, animReq3D;
let floor3DGroups = {};
let view3DFloor = 'all';

function set3DFloorView(val) {
    view3DFloor = val;
    if (val !== 'all' && floors[val]) {
        curFloor = val; // Synchronize active 2D floor tab with 3D floor dropdown selection
    }
    deselectRoom();
    renderFloorTabs();
    render();
    if (is3DMode) {
        build3DScene();
        if (controls3D) {
            controls3D.target.set(BW / 2, view3DFloor === 'all' ? 10 : 4, BH / 2);
        }
    }
}

function toggle3DMode() {
    is3DMode = !is3DMode;
    const btn = document.getElementById('btn3DMode');
    const wrap2D = document.getElementById('canvas2DWrap');
    const container3D = document.getElementById('container3D');

    if (is3DMode) {
        if (typeof THREE === 'undefined') {
            alert('Three.js 3D library offline.');
            is3DMode = false;
            return;
        }
        btn.textContent = '📐 2D';
        btn.style.background = 'var(--success)';
        wrap2D.style.display = 'none';
        container3D.style.display = 'block';
        if (!renderer3D) init3DEngine();
        setTimeout(resize3D, 50);
        build3DScene();
        animate3D();
    } else {
        btn.textContent = '🎲 3D';
        btn.style.background = 'var(--accent)';
        wrap2D.style.display = 'flex';
        container3D.style.display = 'none';
        if (animReq3D) cancelAnimationFrame(animReq3D);
    }
}

function resize3D() {
    if (!renderer3D || !camera3D) return;
    const wrap = document.querySelector('.canvas-wrap');
    const w = wrap ? wrap.clientWidth : window.innerWidth;
    const h = wrap ? wrap.clientHeight : window.innerHeight - 80;
    if (w > 50 && h > 50) {
        camera3D.aspect = w / h;
        camera3D.updateProjectionMatrix();
        renderer3D.setSize(w, h);
    }
}

function init3DEngine() {
    const container = document.getElementById('webgl3D');
    const width = container.clientWidth || window.innerWidth;
    const height = container.clientHeight || window.innerHeight - 80;

    scene3D = new THREE.Scene();
    scene3D.background = new THREE.Color(0x0f172a);
    scene3D.fog = new THREE.FogExp2(0x0f172a, 0.005);

    camera3D = new THREE.PerspectiveCamera(45, width / height, 1, 1000);
    camera3D.position.set(BW * 1.5, 45, BH * 1.8);

    renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer3D.setSize(width, height);
    renderer3D.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer3D.shadowMap.enabled = true;
    renderer3D.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer3D.domElement);

    const ControlsClass = THREE.OrbitControls || window.OrbitControls;
    if (ControlsClass) {
        controls3D = new ControlsClass(camera3D, renderer3D.domElement);
        controls3D.enableDamping = true;
        controls3D.dampingFactor = 0.05;
        controls3D.maxPolarAngle = Math.PI / 2.05;
    }

    // Perfectly Balanced High-Contrast Studio Lighting
    scene3D.add(new THREE.AmbientLight(0xffffff, 0.45));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
    dirLight.position.set(40, 70, 50);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene3D.add(dirLight);

    const fillLight = new THREE.PointLight(0x6366f1, 0.5, 120);
    fillLight.position.set(BW / 2, 30, BH / 2);
    scene3D.add(fillLight);

    window.addEventListener('resize', resize3D);
}

function build3DScene() {
    Object.values(floor3DGroups).forEach(g => scene3D.remove(g));
    floor3DGroups = {};

    // Dynamic Base Ground Plane
    const groundGeo = new THREE.PlaneGeometry(BW * 2, BH * 2);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.set(BW / 2, -0.1, BH / 2);
    groundMesh.receiveShadow = true;
    scene3D.add(groundMesh);

    floorConfig.forEach((fConf, idx) => {
        const fKey = fConf.id;
        const fGroup = new THREE.Group();
        const baseHeight = idx * 10;
        fGroup.position.y = (view3DFloor === 'all' ? baseHeight : 0);
        fGroup.visible = (view3DFloor === 'all' || view3DFloor === fKey);

        // Dynamic Floor Slab (Grid / Slab Layer)
        if (layers.grid !== false) {
            const slabGeo = new THREE.BoxGeometry(BW, 0.4, BH);
            const slabMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
            const slabMesh = new THREE.Mesh(slabGeo, slabMat);
            slabMesh.position.set(BW / 2, -0.2, BH / 2);
            slabMesh.receiveShadow = true;
            fGroup.add(slabMesh);
        }

        // Render Rooms & Walls in 3D (if rooms layer is active)
        if (layers.rooms !== false) {
            const floorRooms = floors[fKey] || [];
            floorRooms.forEach(r => {
                const isTileRoom = r.name.toLowerCase().includes('kitchen') || r.name.toLowerCase().includes('bath') || r.name.toLowerCase().includes('toilet');
                const tileGeo = new THREE.BoxGeometry(r.w - 0.05, 0.1, r.h - 0.05);
                // Oak Wood Plank for Living/Bedrooms/Dining (0xc4a482), Soft Slate Tile for Kitchen/Bath (0x94a3b8)
                const tileMat = new THREE.MeshStandardMaterial({ color: isTileRoom ? 0x94a3b8 : 0xc4a482, roughness: 0.5 });
                const tileMesh = new THREE.Mesh(tileGeo, tileMat);
                tileMesh.position.set(r.x + r.w / 2, 0.05, r.y + r.h / 2);
                tileMesh.receiveShadow = true;
                fGroup.add(tileMesh);

                create3DRoomWalls(fGroup, r, wallHeight3D, floorRooms);
            });
        }

        // Interior Furnishing Layer in 3D
        if (layers.furnishing !== false) {
            const floorRooms = floors[fKey] || [];
            floorRooms.forEach(r => {
                create3DRoomFurnishing(fGroup, r);
            });
        }

        // Custom Drawn Walls in 3D (per-floor, only shows walls for this floor)
        if (layers.walls !== false) {
            const fWalls = floorWalls[fKey] || [];
            fWalls.forEach(w => {
                const length = Math.hypot(w.x2 - w.x1, w.y2 - w.y1);
                if (length < 0.1) return;
                const cx = (w.x1 + w.x2) / 2;
                const cy = (w.y1 + w.y2) / 2;
                const angle = Math.atan2(w.y2 - w.y1, w.x2 - w.x1);
                
                const geo = new THREE.BoxGeometry(length, w.height, w.thickness);
                const mat = new THREE.MeshStandardMaterial({ color: parseInt(w.color.replace('#','0x')), roughness:0.9 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(cx, w.height / 2, cy);
                mesh.rotation.y = -angle;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                fGroup.add(mesh);
            });
        }

        // Mutable Fixed Features rendered in 3D
        if (layers.fixed !== false) {
            // 1. Multi-storey staircases across all floors
            if (layers.stairs !== false) {
                const allStairs = Object.values(floorFixed).flat().filter(ff =>
                    ff.id.includes('stairs') || ff.name.toLowerCase().includes('staircase')
                );
                allStairs.forEach(st => {
                    create3DStairs(fGroup, st.x, st.y, st.w, st.h);
                });
            }

            // 2. Combine floor-specific fixed features + structural shafts/columns from any floor (shafts pass through all storeys)
            const currentFixed = floorFixed[fKey] || [];
            const allShafts = Object.values(floorFixed).flat().filter(ff => {
                const n = ff.name.toLowerCase();
                return n.includes('shaft') || n.includes('column') || n.includes('lift') || n.includes('elevator');
            });

            const combinedFixed = [...currentFixed];
            allShafts.forEach(s => {
                if (!combinedFixed.some(item => item.id === s.id)) {
                    combinedFixed.push(s);
                }
            });

            combinedFixed.forEach(ff => {
                const nameLower = ff.name.toLowerCase();
                if (ff.id.includes('stairs') || nameLower.includes('staircase')) {
                    return; // Rendered above
                } else if (isDoorFeature(ff)) {
                    if (layers.doors_windows !== false) create3DDoor(fGroup, ff);
                } else if (isWindowFeature(ff)) {
                    if (layers.doors_windows !== false) create3DWindow(fGroup, ff);
                } else if (nameLower.includes('septic')) {
                    // Septic Tank (Ground Slab Level only)
                    if (idx === 0) create3DSepticTank(fGroup, ff);
                } else if (nameLower.includes('borewell') || nameLower.includes('sump')) {
                    // Borewell / Sump (Ground Level only)
                    if (idx === 0) create3DBorewell(fGroup, ff);
                } else if (nameLower.includes('overhead') || nameLower.includes('water tank')) {
                    // Overhead Water Tank (Rooftop Level only)
                    if (idx === floorConfig.length - 1) create3DOverheadTank(fGroup, ff, wallHeight3D);
                } else {
                    create3DShaftColumn(fGroup, ff.x, ff.y, ff.w, ff.h, wallHeight3D, ff.color || '#0284c7');
                }
            });
        }

        // Vastu Layer Overlay in 3D
        if (layers.vastu) {
            (floors[fKey] || []).forEach(r => {
                if (r.vastu) {
                    const vMat = new THREE.MeshBasicMaterial({ color: 0xc084fc, opacity: 0.15, transparent: true });
                    const vGeo = new THREE.BoxGeometry(r.w - 0.2, 0.15, r.h - 0.2);
                    const vMesh = new THREE.Mesh(vGeo, vMat);
                    vMesh.position.set(r.x + r.w / 2, 0.12, r.y + r.h / 2);
                    fGroup.add(vMesh);
                }
            });
        }

        scene3D.add(fGroup);
        floor3DGroups[fKey] = fGroup;
    });

    if (controls3D) controls3D.target.set(BW / 2, 10, BH / 2);
}

function create3DSepticTank(group, ff) {
    const w = ff.w || 8, h = ff.h || 5;
    const tankGroup = new THREE.Group();

    // Underground Concrete Tank Slab
    const tankMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });
    const tankGeo = new THREE.BoxGeometry(w, 0.3, h);
    const tankMesh = new THREE.Mesh(tankGeo, tankMat);
    tankMesh.position.set(0, 0.1, 0);
    tankMesh.castShadow = false;
    tankMesh.receiveShadow = true;
    tankGroup.add(tankMesh);

    // Dual Circular Access Manhole Covers
    const coverMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5, roughness: 0.4 });
    const coverGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.1, 16);
    
    const cover1 = new THREE.Mesh(coverGeo, coverMat);
    cover1.position.set(-w * 0.25, 0.25, 0);
    cover1.castShadow = false;
    tankGroup.add(cover1);

    const cover2 = new THREE.Mesh(coverGeo, coverMat);
    cover2.position.set(w * 0.25, 0.25, 0);
    cover2.castShadow = false;
    tankGroup.add(cover2);

    tankGroup.position.set(ff.x + w / 2, 0, ff.y + h / 2);
    group.add(tankGroup);
}

function create3DBorewell(group, ff) {
    const w = ff.w || 4, h = ff.h || 4;
    const cx = ff.x + w / 2;
    const cy = ff.y + h / 2;
    const bGroup = new THREE.Group();

    // Concrete Sump Ring (low flat cylinder at ground level)
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.9 });
    const outerR = Math.min(w, h) * 0.45;
    const ringGeo = new THREE.CylinderGeometry(outerR, outerR, 0.35, 24);
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.position.set(0, 0.15, 0);
    ringMesh.castShadow = false;   // Ground-level — no tall shadow!
    ringMesh.receiveShadow = true;
    bGroup.add(ringMesh);

    // Inner dark water surface
    const innerMat = new THREE.MeshStandardMaterial({ color: 0x0c4a6e, roughness: 0.2, metalness: 0.3 });
    const innerGeo = new THREE.CylinderGeometry(outerR * 0.72, outerR * 0.72, 0.05, 24);
    const innerMesh = new THREE.Mesh(innerGeo, innerMat);
    innerMesh.position.set(0, 0.35, 0);
    innerMesh.castShadow = false;
    bGroup.add(innerMesh);

    // Borewell pipe stub (very short, ground level only)
    const pipeMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.6, roughness: 0.4 });
    const pipeGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.5, 12);
    const pipeMesh = new THREE.Mesh(pipeGeo, pipeMat);
    pipeMesh.position.set(outerR * 0.5, 0.55, 0);
    pipeMesh.castShadow = false;
    bGroup.add(pipeMesh);

    bGroup.position.set(cx, 0, cy);
    group.add(bGroup);
}

function create3DOverheadTank(group, ff, floorHeight) {
    const w = ff.w || 4, h = ff.h || 4;
    const tankGroup = new THREE.Group();
    const stiltH = 2.5;
    const tankRadius = Math.min(w, h) * 0.38;
    const tankHeight = 3.2;

    // 4 Metallic Leg Stilts
    const legMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.3 });
    const legGeo = new THREE.CylinderGeometry(0.1, 0.1, stiltH, 8);
    const legOffsets = [
        { x: -w * 0.3, z: -h * 0.3 },
        { x:  w * 0.3, z: -h * 0.3 },
        { x: -w * 0.3, z:  h * 0.3 },
        { x:  w * 0.3, z:  h * 0.3 }
    ];

    legOffsets.forEach(off => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(off.x, floorHeight + stiltH / 2, off.z);
        tankGroup.add(leg);
    });

    // Cylindrical Blue Water Tank Vessel
    const tankMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3, metalness: 0.2 });
    const tankGeo = new THREE.CylinderGeometry(tankRadius, tankRadius, tankHeight, 24);
    const tankMesh = new THREE.Mesh(tankGeo, tankMat);
    tankMesh.position.set(0, floorHeight + stiltH + tankHeight / 2, 0);
    tankMesh.castShadow = true;
    tankMesh.receiveShadow = true;
    tankGroup.add(tankMesh);

    // Domed Top Lid
    const lidMat = new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.2 });
    const lidGeo = new THREE.CylinderGeometry(tankRadius * 0.7, tankRadius, 0.3, 24);
    const lidMesh = new THREE.Mesh(lidGeo, lidMat);
    lidMesh.position.set(0, floorHeight + stiltH + tankHeight + 0.15, 0);
    tankGroup.add(lidMesh);

    tankGroup.position.set(ff.x + w / 2, 0, ff.y + h / 2);
    group.add(tankGroup);
}

function create3DShaftColumn(group, x, y, w, h, height, colorHex) {
    const shaftMat = new THREE.MeshStandardMaterial({ color: colorHex, opacity: 0.6, transparent: true, roughness: 0.3 });
    const geo = new THREE.BoxGeometry(w, height, h);
    const mesh = new THREE.Mesh(geo, shaftMat);
    mesh.position.set(x + w / 2, height / 2, y + h / 2);
    group.add(mesh);
}

function getWallSegments(totalLen, openingsOnWall) {
    const sorted = [...(openingsOnWall || [])].sort((a, b) => a.offset - b.offset);
    const segments = [];
    let cur = 0;

    sorted.forEach(op => {
        const opStart = Math.max(0, Math.min(totalLen, op.offset));
        const opEnd = Math.max(0, Math.min(totalLen, op.offset + op.length));
        if (opStart > cur) {
            segments.push({ start: cur, end: opStart, isOpen: false });
        }
        if (opEnd > opStart) {
            segments.push({ start: opStart, end: opEnd, isOpen: true });
        }
        cur = Math.max(cur, opEnd);
    });

    if (cur < totalLen) {
        segments.push({ start: cur, end: totalLen, isOpen: false });
    }
    return segments;
}

function getEffectiveRoomOpenings(room, wallName, allRooms) {
    const ops = [...(room.openings || []).filter(o => o.wall === wallName)];
    const roomsList = allRooms || curRooms();
    
    roomsList.forEach(other => {
        if (other.id === room.id) return;
        const otherOps = other.openings || [];
        
        if (wallName === 'north' && Math.abs(room.y - (other.y + other.h)) < 0.2) {
            otherOps.filter(o => o.wall === 'south').forEach(o => {
                const gStart = other.x + o.offset, gEnd = gStart + o.length;
                const lStart = clamp(gStart - room.x, 0, room.w);
                const lEnd = clamp(gEnd - room.x, 0, room.w);
                if (lEnd > lStart) ops.push({ wall: 'north', offset: lStart, length: lEnd - lStart });
            });
        } else if (wallName === 'south' && Math.abs((room.y + room.h) - other.y) < 0.2) {
            otherOps.filter(o => o.wall === 'north').forEach(o => {
                const gStart = other.x + o.offset, gEnd = gStart + o.length;
                const lStart = clamp(gStart - room.x, 0, room.w);
                const lEnd = clamp(gEnd - room.x, 0, room.w);
                if (lEnd > lStart) ops.push({ wall: 'south', offset: lStart, length: lEnd - lStart });
            });
        } else if (wallName === 'west' && Math.abs(room.x - (other.x + other.w)) < 0.2) {
            otherOps.filter(o => o.wall === 'east').forEach(o => {
                const gStart = other.y + o.offset, gEnd = gStart + o.length;
                const lStart = clamp(gStart - room.y, 0, room.h);
                const lEnd = clamp(gEnd - room.y, 0, room.h);
                if (lEnd > lStart) ops.push({ wall: 'west', offset: lStart, length: lEnd - lStart });
            });
        } else if (wallName === 'east' && Math.abs((room.x + room.w) - other.x) < 0.2) {
            otherOps.filter(o => o.wall === 'west').forEach(o => {
                const gStart = other.y + o.offset, gEnd = gStart + o.length;
                const lStart = clamp(gStart - room.y, 0, room.h);
                const lEnd = clamp(gEnd - room.y, 0, room.h);
                if (lEnd > lStart) ops.push({ wall: 'east', offset: lStart, length: lEnd - lStart });
            });
        }
    });
    
    return ops;
}

function create3DRoomWalls(group, room, height, allRooms) {
    const x = room.x, y = room.y, w = room.w, h = room.h;
    const wallThick = 0.3;
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.4 });
    const capMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
    const roomsList = allRooms || curRooms();

    function addWallSegment(wx, wy, wz, sw, sh, sd) {
        const geo = new THREE.BoxGeometry(sw, sh, sd);
        const mesh = new THREE.Mesh(geo, wallMat);
        mesh.position.set(wx, wy, wz);
        mesh.castShadow = true; mesh.receiveShadow = true;
        group.add(mesh);

        const capGeo = new THREE.BoxGeometry(sw, 0.2, sd);
        const capMesh = new THREE.Mesh(capGeo, capMat);
        capMesh.position.set(wx, sh + 0.1, wz);
        group.add(capMesh);
    }

    // North Wall
    const nOps = getEffectiveRoomOpenings(room, 'north', roomsList);
    const nSegs = getWallSegments(w, nOps);
    nSegs.forEach(s => {
        if (!s.isOpen) {
            const subW = s.end - s.start;
            addWallSegment(x + s.start + subW / 2, height / 2, y, subW, height, wallThick);
        }
    });

    // South Wall
    const sOps = getEffectiveRoomOpenings(room, 'south', roomsList);
    const sSegs = getWallSegments(w, sOps);
    sSegs.forEach(s => {
        if (!s.isOpen) {
            const subW = s.end - s.start;
            addWallSegment(x + s.start + subW / 2, height / 2, y + h, subW, height, wallThick);
        }
    });

    // West Wall
    const wOps = getEffectiveRoomOpenings(room, 'west', roomsList);
    const wSegs = getWallSegments(h, wOps);
    wSegs.forEach(s => {
        if (!s.isOpen) {
            const subH = s.end - s.start;
            addWallSegment(x, height / 2, y + s.start + subH / 2, wallThick, height, subH);
        }
    });

    // East Wall
    const eOps = getEffectiveRoomOpenings(room, 'east', roomsList);
    const eSegs = getWallSegments(h, eOps);
    eSegs.forEach(s => {
        if (!s.isOpen) {
            const subH = s.end - s.start;
            addWallSegment(x + w, height / 2, y + s.start + subH / 2, wallThick, height, subH);
        }
    });
}

function render2DRoomFurnishing(r, rw, rh) {
    const nameLower = (r.name || '').toLowerCase();
    let svg = '';

    // 1. BATHROOM / TOILET / WASHROOM (Commode, Wash Basin + Tap, Shower Enclosure)
    if (nameLower.includes('bath') || nameLower.includes('toilet') || nameLower.includes('washroom') || nameLower.includes('wc')) {
        // Commode (Western Toilet) at Top-Left Corner
        const wcW = 1.2 * S, wcH = 1.6 * S;
        svg += `<g transform="translate(6, 6)">
            <!-- Tank -->
            <rect width="${wcW}" height="${wcH * 0.4}" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="2"/>
            <circle cx="${wcW/2}" cy="${wcH * 0.2}" r="2" fill="#0284c7"/>

            <ellipse cx="${wcW/2}" cy="${wcH * 0.7}" rx="${wcW*0.28}" ry="${wcH*0.22}" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8"/>
            <text x="${wcW/2}" y="${wcH + 9}" text-anchor="middle" fill="#64748b" font-size="7" font-weight="600">WC Commode</text>
        </g>`;

        // Wash Basin & Tap Vanity Counter (Top-Right)
        const basinW = 2.2 * S, basinH = 1.4 * S;
        const basinX = rw - basinW - 6;
        svg += `<g transform="translate(${basinX}, 6)">

            <ellipse cx="${basinW/2}" cy="${basinH/2 + 2}" rx="${basinW*0.38}" ry="${basinH*0.3}" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>

        // Shower Area & Glass Enclosure (Bottom-Right)

        </g>`;
    }
    // 2. KITCHEN (Granite Counter, Fridge, Gas Stove, Sink + Tap)
    else if (nameLower.includes('kitchen')) {
        const cDepth = 2 * S;
        // L-Shaped Countertop (South & West walls)
        svg += `<path d="M 0 0 L ${cDepth} 0 L ${cDepth} ${rh - cDepth} L ${rw} ${rh - cDepth} L ${rw} ${rh} L 0 ${rh} Z" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>`;

        // Refrigerator (North-West Corner)
        const fridgeW = 2.5 * S, fridgeH = 2.5 * S;
        svg += `<g transform="translate(4, 4)">

        </g>`;

        // Gas Stove / Cooktop on South Counter
        const stoveW = 3 * S, stoveH = 1.8 * S;
        const stoveX = rw - stoveW - 10;
        const stoveY = rh - cDepth + (cDepth - stoveH) / 2;
        svg += `<g transform="translate(${stoveX}, ${stoveY})">
            <rect width="${stoveW}" height="${stoveH}" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" rx="3"/>

            <circle cx="${stoveW*0.75}" cy="${stoveH*0.7}" r="5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        </g>`;

        // Dual Basin Kitchen Sink + Gooseneck Tap on West Counter
        const sinkW = 1.8 * S, sinkH = 3 * S;
        const sinkX = (cDepth - sinkW) / 2;
        const sinkY = (rh - sinkH) / 2;
        svg += `<g transform="translate(${sinkX}, ${sinkY})">
            <rect width="${sinkW}" height="${sinkH}" fill="#3f3f46" stroke="#38bdf8" stroke-width="1.5" rx="3"/>
            <rect x="3" y="3" width="${sinkW - 6}" height="${sinkH/2 - 4}" fill="#0284c7" fill-opacity="0.4" rx="2"/>
            <rect x="3" y="${sinkH/2 + 1}" width="${sinkW - 6}" height="${sinkH/2 - 4}" fill="#0284c7" fill-opacity="0.4" rx="2"/>
            <!-- Gooseneck Tap & Spout -->
            <circle cx="${sinkW/2}" cy="${sinkH/2}" r="3" fill="#e0f2fe"/>
            <path d="M ${sinkW/2} ${sinkH/2} L ${sinkW/2 - 4} ${sinkH/2}" stroke="#ffffff" stroke-width="2"/>
            <text x="${sinkW/2 + 10}" y="${sinkH/2 + 3}" fill="#38bdf8" font-size="7" font-weight="700">Sink & Tap</text>
        </g>`;
    }
    // 3. BEDROOM (Any Bedroom)
    else if (nameLower.includes('bedroom') || nameLower.includes('bed')) {
        const bedW = Math.min(6.5 * S, rw * 0.65), bedH = Math.min(6 * S, rh * 0.6);
        const bedX = (rw - bedW) / 2;
        const bedY = rh - bedH - 8;

        // Area Rug
        svg += `<rect x="${bedX - 10}" y="${bedY - 8}" width="${bedW + 20}" height="${bedH + 16}" fill="rgba(255,255,255,0.05)" rx="6" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,2"/>`;

        // Headboard
        svg += `<rect x="${bedX}" y="${bedY + bedH - 6}" width="${bedW}" height="8" fill="#1e1b4b" rx="2"/>`;

        // Bed Frame & Mattress
        svg += `<rect x="${bedX + 4}" y="${bedY}" width="${bedW - 8}" height="${bedH - 6}" fill="#312e81" stroke="#818cf8" stroke-width="1.5" rx="4"/>`;
        // Duvet
        svg += `<rect x="${bedX + 4}" y="${bedY + bedH * 0.35}" width="${bedW - 8}" height="${bedH * 0.55}" fill="#4338ca" rx="2"/>`;
        svg += `<line x1="${bedX + 4}" y1="${bedY + bedH * 0.35}" x2="${bedX + bedW - 4}" y2="${bedY + bedH * 0.35}" stroke="#a5b4fc" stroke-width="1.5"/>`;

        // Pillows
        const pW = (bedW - 24) / 2;
        svg += `<rect x="${bedX + 8}" y="${bedY + bedH - 24}" width="${pW}" height="14" fill="#f8fafc" rx="3" stroke="#cbd5e1"/>`;
        svg += `<rect x="${bedX + bedW - 8 - pW}" y="${bedY + bedH - 24}" width="${pW}" height="14" fill="#f8fafc" rx="3" stroke="#cbd5e1"/>`;

        // Nightstands
        const nsSize = 1.4 * S;
        if (bedX - nsSize - 4 > 0) {
            svg += `<g transform="translate(${bedX - nsSize - 4}, ${bedY + bedH - nsSize})">
                <rect width="${nsSize}" height="${nsSize}" fill="#1e1b4b" stroke="#6366f1" rx="2"/>
                <circle cx="${nsSize/2}" cy="${nsSize/2}" r="4" fill="#facc15"/>
            </g>`;
        }
        if (bedX + bedW + 4 + nsSize < rw) {
            svg += `<g transform="translate(${bedX + bedW + 4}, ${bedY + bedH - nsSize})">
                <rect width="${nsSize}" height="${nsSize}" fill="#1e1b4b" stroke="#6366f1" rx="2"/>
                <circle cx="${nsSize/2}" cy="${nsSize/2}" r="4" fill="#facc15"/>
            </g>`;
        }

        // Wardrobe on East Wall
        const wardW = 1.8 * S, wardH = Math.min(rh * 0.6, 6.5 * S);
        if (rw - wardW - 4 > bedX + bedW) {
            svg += `<g transform="translate(${rw - wardW - 4}, 8)">
                <rect width="${wardW}" height="${wardH}" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="1.2" rx="3"/>
                <line x1="0" y1="${wardH/2}" x2="${wardW}" y2="${wardH/2}" stroke="#6366f1" stroke-dasharray="2,2"/>
                <text x="${wardW/2}" y="${wardH/2 + 3}" text-anchor="middle" fill="#c7d2fe" font-size="7" font-weight="600">Wardrobe</text>
            </g>`;
        }
    }
    // 4. DINING AREA / LIVING ROOM (Dining Table, 6 Chairs, Dining Wash Basin)
    else if (nameLower.includes('dining') || nameLower.includes('living') || nameLower.includes('hall')) {
        // Dining Table with Chairs
        const tblW = Math.min(5.5 * S, rw * 0.5), tblH = Math.min(3.5 * S, rh * 0.4);
        const tblX = (rw - tblW) / 2, tblY = (rh - tblH) / 2;

        svg += `<rect x="${tblX}" y="${tblY}" width="${tblW}" height="${tblH}" fill="#831843" stroke="#f472b6" stroke-width="1.5" rx="4"/>`;
        // Table Centerpiece
        svg += `<circle cx="${tblX + tblW/2}" cy="${tblY + tblH/2}" r="6" fill="#fb7185"/>`;

        // 6 Chairs
        const cW = 1.2 * S, cH = 1.0 * S;
        // Top Chairs
        svg += `<rect x="${tblX + tblW*0.25 - cW/2}" y="${tblY - cH - 2}" width="${cW}" height="${cH}" fill="#4c0519" stroke="#f472b6" rx="2"/>`;
        svg += `<rect x="${tblX + tblW*0.75 - cW/2}" y="${tblY - cH - 2}" width="${cW}" height="${cH}" fill="#4c0519" stroke="#f472b6" rx="2"/>`;
        // Bottom Chairs
        svg += `<rect x="${tblX + tblW*0.25 - cW/2}" y="${tblY + tblH + 2}" width="${cW}" height="${cH}" fill="#4c0519" stroke="#f472b6" rx="2"/>`;
        svg += `<rect x="${tblX + tblW*0.75 - cW/2}" y="${tblY + tblH + 2}" width="${cW}" height="${cH}" fill="#4c0519" stroke="#f472b6" rx="2"/>`;

        // Dining Wash Basin + Tap Counter (Northeast corner)
        const dBasinW = 2 * S, dBasinH = 1.4 * S;
        svg += `<g transform="translate(${rw - dBasinW - 4}, 4)">
            <rect width="${dBasinW}" height="${dBasinH}" fill="#1e293b" stroke="#f472b6" rx="2"/>
            <ellipse cx="${dBasinW/2}" cy="${dBasinH/2}" rx="${dBasinW*0.35}" ry="${dBasinH*0.3}" fill="#ffffff" stroke="#38bdf8"/>
            <circle cx="${dBasinW/2}" cy="${dBasinH/2 - 4}" r="2" fill="#38bdf8"/>
            <text x="${dBasinW/2}" y="${dBasinH + 8}" text-anchor="middle" fill="#f472b6" font-size="7" font-weight="600">Dining Basin</text>
        </g>`;
    }
    // 5. POOJA ROOM
    else if (nameLower.includes('pooja') || nameLower.includes('prayer')) {
        const mandirW = rw * 0.6, mandirH = rh * 0.4;
        const mX = (rw - mandirW) / 2, mY = 6;
        svg += `<g transform="translate(${mX}, ${mY})">
            <rect width="${mandirW}" height="${mandirH}" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" rx="3"/>
            <circle cx="${mandirW/2}" cy="${mandirH/2}" r="8" fill="#facc15"/>
            <text x="${mandirW/2}" y="${mandirH/2 + 3}" text-anchor="middle" fill="#78350f" font-size="9" font-weight="900">🪔</text>
            <text x="${mandirW/2}" y="${mandirH + 10}" text-anchor="middle" fill="#f59e0b" font-size="7" font-weight="700">Mandir Altar</text>
        </g>`;
    }

    return svg;
}

function create3DRoomFurnishing(group, r) {
    const nameLower = (r.name || '').toLowerCase();
    const rx = r.x, ry = r.y, rw = r.w, rh = r.h;

    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
    const limeMat = new THREE.MeshStandardMaterial({ color: 0x84cc16, roughness: 0.4 });
    const darkChairMat = new THREE.MeshStandardMaterial({ color: 0x65a30d, roughness: 0.4 });
    const oakWoodMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.5 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, opacity: 0.4, transparent: true });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });

    // 1. DINING & LIVING ROOM (Matches Arden Estate Reference Image Exactly)
    if (nameLower.includes('dining') || nameLower.includes('living') || nameLower.includes('hall')) {
        const tblW = Math.min(6.0, rw * 0.55), tblH = Math.min(3.5, rh * 0.45);
        const tblX = rx + (rw - tblW) / 2, tblZ = ry + (rh - tblH) / 2;

        // Pure White Dining Table
        const tableGeo = new THREE.BoxGeometry(tblW, 2.5, tblH);
        const tableMesh = new THREE.Mesh(tableGeo, whiteMat);
        tableMesh.position.set(tblX + tblW / 2, 1.25, tblZ + tblH / 2);
        tableMesh.castShadow = true;
        group.add(tableMesh);

        // Lime Green Center Table Runner
        const runnerGeo = new THREE.BoxGeometry(tblW - 0.4, 0.05, tblH * 0.4);
        const runnerMesh = new THREE.Mesh(runnerGeo, limeMat);
        runnerMesh.position.set(tblX + tblW / 2, 2.53, tblZ + tblH / 2);
        group.add(runnerMesh);

        // 6 Lime Green Upholstered Dining Chairs
        const cGeo = new THREE.BoxGeometry(1.2, 2.8, 1.2);
        const chairOffsets = [
            { x: tblX + tblW * 0.25, z: tblZ - 0.9 },
            { x: tblX + tblW * 0.75, z: tblZ - 0.9 },
            { x: tblX + tblW * 0.25, z: tblZ + tblH + 0.9 },
            { x: tblX + tblW * 0.75, z: tblZ + tblH + 0.9 },
            { x: tblX - 0.9, z: tblZ + tblH / 2 },
            { x: tblX + tblW + 0.9, z: tblZ + tblH / 2 },
        ];
        chairOffsets.forEach(cPos => {
            const chair = new THREE.Mesh(cGeo, darkChairMat);
            chair.position.set(cPos.x, 1.4, cPos.z);
            chair.castShadow = true;
            group.add(chair);
        });

        // Modern White Sofa + Lime Green Pillows (Living Area)
        const sofaW = Math.min(7.0, rw * 0.6);
        const sofaGeo = new THREE.BoxGeometry(sofaW, 1.8, 2.8);
        const sofaMesh = new THREE.Mesh(sofaGeo, whiteMat);
        sofaMesh.position.set(rx + rw / 2, 0.9, ry + rh - 2.0);
        sofaMesh.castShadow = true;
        group.add(sofaMesh);

        // Lime Green Accent Throw Pillows
        const pillowGeo = new THREE.BoxGeometry(1.2, 0.8, 0.4);
        const p1 = new THREE.Mesh(pillowGeo, limeMat);
        p1.position.set(rx + rw / 2 - 2.0, 1.9, ry + rh - 1.2);
        group.add(p1);

        const p2 = new THREE.Mesh(pillowGeo, limeMat);
        p2.position.set(rx + rw / 2 + 2.0, 1.9, ry + rh - 1.2);
        group.add(p2);

        // Glass Coffee Table with Black Legs
        const ctGeo = new THREE.BoxGeometry(4.0, 1.2, 2.0);
        const ctMesh = new THREE.Mesh(ctGeo, glassMat);
        ctMesh.position.set(rx + rw / 2, 0.6, ry + rh - 4.5);
        group.add(ctMesh);
    }
    // 2. KITCHEN (Matches Arden Estate Reference Image Exactly)
    else if (nameLower.includes('kitchen')) {
        const cDepth = 2.0, cHeight = 2.8;

        // White Cabinet Bases
        const sCounterGeo = new THREE.BoxGeometry(rw, cHeight - 0.2, cDepth);
        const sCounterMesh = new THREE.Mesh(sCounterGeo, whiteMat);
        sCounterMesh.position.set(rx + rw / 2, (cHeight - 0.2) / 2, ry + rh - cDepth / 2);
        group.add(sCounterMesh);

        const wCounterGeo = new THREE.BoxGeometry(cDepth, cHeight - 0.2, rh - cDepth);
        const wCounterMesh = new THREE.Mesh(wCounterGeo, whiteMat);
        wCounterMesh.position.set(rx + cDepth / 2, (cHeight - 0.2) / 2, ry + (rh - cDepth) / 2);
        group.add(wCounterMesh);

        // Natural Oak Wooden Countertop Slab
        const sTopGeo = new THREE.BoxGeometry(rw, 0.2, cDepth);
        const sTopMesh = new THREE.Mesh(sTopGeo, oakWoodMat);
        sTopMesh.position.set(rx + rw / 2, cHeight - 0.1, ry + rh - cDepth / 2);
        group.add(sTopMesh);

        const wTopGeo = new THREE.BoxGeometry(cDepth, 0.2, rh - cDepth);
        const wTopMesh = new THREE.Mesh(wTopGeo, oakWoodMat);
        wTopMesh.position.set(rx + cDepth / 2, cHeight - 0.1, ry + (rh - cDepth) / 2);
        group.add(wTopMesh);

        // Refrigerator
        const fridgeGeo = new THREE.BoxGeometry(2.5, 6.5, 2.5);
        const fridgeMesh = new THREE.Mesh(fridgeGeo, whiteMat);
        fridgeMesh.position.set(rx + 1.5, 3.25, ry + 1.5);
        group.add(fridgeMesh);

        // Black Glass Gas Cooktop
        const stoveGeo = new THREE.BoxGeometry(3.0, 0.15, 1.8);
        const stoveMesh = new THREE.Mesh(stoveGeo, blackMat);
        stoveMesh.position.set(rx + rw - 2.5, cHeight + 0.08, ry + rh - cDepth / 2);
        group.add(stoveMesh);
    }
    // 3. BEDROOM & OFFICE
    else if (nameLower.includes('bedroom') || nameLower.includes('bed')) {
        const bedW = Math.min(6.5, rw * 0.65), bedH = Math.min(6.0, rh * 0.6), bedHeight = 1.6;
        const bedX = rx + (rw - bedW) / 2;
        const bedZ = ry + rh - bedH - 0.4;

        const bedGeo = new THREE.BoxGeometry(bedW, bedHeight, bedH);
        const bedMesh = new THREE.Mesh(bedGeo, whiteMat);
        bedMesh.position.set(bedX + bedW / 2, bedHeight / 2, bedZ + bedH / 2);
        group.add(bedMesh);

        // Lime Green Accent Blanket / Duvet
        const duvetGeo = new THREE.BoxGeometry(bedW - 0.2, 0.2, bedH * 0.65);
        const duvetMesh = new THREE.Mesh(duvetGeo, limeMat);
        duvetMesh.position.set(bedX + bedW / 2, bedHeight + 0.1, bedZ + bedH * 0.35);
        group.add(duvetMesh);

        // White Desk + Black Swivel Chair
        const deskGeo = new THREE.BoxGeometry(3.5, 2.4, 1.8);
        const deskMesh = new THREE.Mesh(deskGeo, whiteMat);
        deskMesh.position.set(rx + 2.2, 1.2, ry + 1.5);
        group.add(deskMesh);

        const chairGeo = new THREE.BoxGeometry(1.2, 3.2, 1.2);
        const chairMesh = new THREE.Mesh(chairGeo, blackMat);
        chairMesh.position.set(rx + 2.2, 1.6, ry + 3.0);
        group.add(chairMesh);
    }
}

function addRoomOpening(roomId) {
    const room = curRooms().find(r => r.id === roomId);
    if (!room) return;
    if (!room.openings) room.openings = [];
    room.openings.push({
        id: 'op_' + Math.random().toString(36).substr(2, 6),
        wall: 'south',
        offset: 1,
        length: 3
    });
    pushHistory(); render(); updateProps();
    if (is3DMode) build3DScene();
}

function updateRoomOpening(roomId, opId, key, val) {
    const room = curRooms().find(r => r.id === roomId);
    if (!room || !room.openings) return;
    const op = room.openings.find(o => o.id === opId);
    if (!op) return;
    op[key] = val;
    pushHistory(); render(); updateProps();
    if (is3DMode) build3DScene();
}

function deleteRoomOpening(roomId, opId) {
    const room = curRooms().find(r => r.id === roomId);
    if (!room || !room.openings) return;
    room.openings = room.openings.filter(o => o.id !== opId);
    pushHistory(); render(); updateProps();
    if (is3DMode) build3DScene();
}

function render2DRoomSVG(r, rx, ry, rw, rh, isSel) {
    const strokeCol = isSel ? '#7c6ff5' : r.color;
    const strokeW = isSel ? 3 : 2;
    const ops = r.openings || [];

    let svgStr = `<g transform="translate(${rx},${ry})" style="cursor:${curTool==='move'?'grab':'pointer'}" onclick="selectRoomClick(event, '${r.id}')" onmousedown="startDrag(event, '${r.id}')" ontouchstart="startDrag(event, '${r.id}')">
        <rect width="${rw}" height="${rh}" fill="${r.color}" fill-opacity="${isSel?0.5:0.35}" stroke="none" rx="3"/>`;

    // North Wall Segments
    const nSegs = getWallSegments(r.w, ops.filter(o => o.wall === 'north'));
    nSegs.forEach(s => {
        if (!s.isOpen) {
            svgStr += `<line x1="${s.start*S}" y1="0" x2="${s.end*S}" y2="0" stroke="${strokeCol}" stroke-width="${strokeW}"/>`;
        } else {
            svgStr += `<line x1="${s.start*S}" y1="0" x2="${s.end*S}" y2="0" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        }
    });

    // South Wall Segments
    const sSegs = getWallSegments(r.w, ops.filter(o => o.wall === 'south'));
    sSegs.forEach(s => {
        if (!s.isOpen) {
            svgStr += `<line x1="${s.start*S}" y1="${rh}" x2="${s.end*S}" y2="${rh}" stroke="${strokeCol}" stroke-width="${strokeW}"/>`;
        } else {
            svgStr += `<line x1="${s.start*S}" y1="${rh}" x2="${s.end*S}" y2="${rh}" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        }
    });

    // West Wall Segments
    const wSegs = getWallSegments(r.h, ops.filter(o => o.wall === 'west'));
    wSegs.forEach(s => {
        if (!s.isOpen) {
            svgStr += `<line x1="0" y1="${s.start*S}" x2="0" y2="${s.end*S}" stroke="${strokeCol}" stroke-width="${strokeW}"/>`;
        } else {
            svgStr += `<line x1="0" y1="${s.start*S}" x2="0" y2="${s.end*S}" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        }
    });

    // East Wall Segments
    const eSegs = getWallSegments(r.h, ops.filter(o => o.wall === 'east'));
    eSegs.forEach(s => {
        if (!s.isOpen) {
            svgStr += `<line x1="${rw}" y1="${s.start*S}" x2="${rw}" y2="${s.end*S}" stroke="${strokeCol}" stroke-width="${strokeW}"/>`;
        } else {
            svgStr += `<line x1="${rw}" y1="${s.start*S}" x2="${rw}" y2="${s.end*S}" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        }
    });

    svgStr += render2DRoomFurnishing(r, rw, rh);

    svgStr += `<text x="${rw/2}" y="${rh/2 - 6}" text-anchor="middle" fill="#e8e8f0" font-size="11" font-weight="600">${r.icon || '🚪'} ${r.name}</text>
               <text x="${rw/2}" y="${rh/2 + 8}" text-anchor="middle" fill="#9898b0" font-size="9">${r.w}' × ${r.h}' (${r.w*r.h} sqft)</text>`;

    if (isSel) {
        const hs = 12;
        svgStr += `<rect x="${-hs/2}" y="${-hs/2}" width="${hs}" height="${hs}" fill="#7c6ff5" stroke="#fff" stroke-width="1.5" style="cursor:nwse-resize" onmousedown="startResize(event,'${r.id}','nw')" ontouchstart="startResize(event,'${r.id}','nw')"/>
              <rect x="${rw-hs/2}" y="${-hs/2}" width="${hs}" height="${hs}" fill="#7c6ff5" stroke="#fff" stroke-width="1.5" style="cursor:nesw-resize" onmousedown="startResize(event,'${r.id}','ne')" ontouchstart="startResize(event,'${r.id}','ne')"/>
              <rect x="${-hs/2}" y="${rh-hs/2}" width="${hs}" height="${hs}" fill="#7c6ff5" stroke="#fff" stroke-width="1.5" style="cursor:nesw-resize" onmousedown="startResize(event,'${r.id}','sw')" ontouchstart="startResize(event,'${r.id}','sw')"/>
              <rect x="${rw-hs/2}" y="${rh-hs/2}" width="${hs}" height="${hs}" fill="#7c6ff5" stroke="#fff" stroke-width="1.5" style="cursor:nwse-resize" onmousedown="startResize(event,'${r.id}','se')" ontouchstart="startResize(event,'${r.id}','se')"/>`;
    }
    svgStr += `</g>`;
    return svgStr;
}

function renderRotationAndResizeHandles(fw, fh, id, isDoor) {
    const hs = 12;
    let h = `<rect x="${-hs/2}" y="${-hs/2}" width="${hs}" height="${hs}" fill="#fbbf24" stroke="#fff" stroke-width="1.5" style="cursor:nwse-resize" onmousedown="startResizeFixed(event,'${id}','nw')" ontouchstart="startResizeFixed(event,'${id}','nw')"/>
          <rect x="${fw-hs/2}" y="${-hs/2}" width="${hs}" height="${hs}" fill="#fbbf24" stroke="#fff" stroke-width="1.5" style="cursor:nesw-resize" onmousedown="startResizeFixed(event,'${id}','ne')" ontouchstart="startResizeFixed(event,'${id}','ne')"/>
          <rect x="${-hs/2}" y="${fh-hs/2}" width="${hs}" height="${hs}" fill="#fbbf24" stroke="#fff" stroke-width="1.5" style="cursor:nesw-resize" onmousedown="startResizeFixed(event,'${id}','sw')" ontouchstart="startResizeFixed(event,'${id}','sw')"/>
          <rect x="${fw-hs/2}" y="${fh-hs/2}" width="${hs}" height="${hs}" fill="#fbbf24" stroke="#fff" stroke-width="1.5" style="cursor:nwse-resize" onmousedown="startResizeFixed(event,'${id}','se')" ontouchstart="startResizeFixed(event,'${id}','se')"/>
          
          <!-- PROMINENT ROTATION HANDLE -->
          <line x1="${fw/2}" y1="0" x2="${fw/2}" y2="-22" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,2"/>
          <circle cx="${fw/2}" cy="-22" r="11" fill="#fbbf24" stroke="#fff" stroke-width="1.5" style="cursor:pointer" onclick="event.stopPropagation(); rotateFixed90('${id}')"/>
          <text x="${fw/2}" y="-18" text-anchor="middle" fill="#000" font-size="11" font-weight="900" style="pointer-events:none">🔄</text>`;
          
    if (isDoor) {
        h += `<circle cx="${fw + 20}" cy="${fh/2}" r="11" fill="#f59e0b" stroke="#fff" stroke-width="1.5" style="cursor:pointer" onclick="event.stopPropagation(); flipDoorSwing('${id}')"/>
              <text x="${fw + 20}" y="${fh/2 + 4}" text-anchor="middle" fill="#fff" font-size="10" font-weight="900" style="pointer-events:none">↔️</text>`;
    }
    return h;
}

function render2DDoorSVG(ff, fx, fy, fw, fh, isSel) {
    const rot = ff.rotation || 0;
    const isDouble = (ff.w >= 5);
    const flip = ff.flipSwing ? -1 : 1;
    const arcRadius = Math.min(fw * 0.85, 38); // compact 2D door swing arc radius!
    
    let h = `<g transform="translate(${fx + fw/2}, ${fy + fh/2}) rotate(${rot}) translate(${-fw/2}, ${-fh/2})" style="cursor:${(!lockFixed && curTool==='move')?'grab':'pointer'}" onclick="selectFixedClick(event, '${ff.id}')" onmousedown="startDragFixed(event, '${ff.id}')" ontouchstart="startDragFixed(event, '${ff.id}')">`;

    // Sleek Wall Opening Cutout Base
    h += `<rect x="0" y="0" width="${fw}" height="${fh}" fill="#0f172a" stroke="${isSel ? '#fbbf24' : '#eab308'}" stroke-width="${isSel ? 2 : 1}" rx="1"/>`;

    if (!isDouble) {
        // Simple Compact Single Door: Sleek jambs + compact swing leaf line + subtle arc
        const swingDir = flip * (fh / 2 + arcRadius);
        h += `<path d="M 3 ${fh/2} A ${arcRadius} ${arcRadius} 0 0 1 ${3 + arcRadius} ${swingDir}" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="2,2"/>`;
        h += `<line x1="3" y1="${fh/2}" x2="3" y2="${swingDir}" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>`;
        // Frame jambs
        h += `<rect x="0" y="-1" width="3" height="${fh + 2}" fill="#eab308"/>`;
        h += `<rect x="${fw-3}" y="-1" width="3" height="${fh + 2}" fill="#eab308"/>`;
    } else {
        // Simple Compact Double Door: Dual meeting leafs + twin compact arcs
        const halfArc = Math.min((fw - 6) / 2, 30);
        const swingDir = flip * (fh / 2 + halfArc);
        h += `<path d="M 3 ${fh/2} A ${halfArc} ${halfArc} 0 0 1 ${3 + halfArc} ${swingDir}" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="2,2"/>`;
        h += `<path d="M ${fw - 3} ${fh/2} A ${halfArc} ${halfArc} 0 0 0 ${fw - 3 - halfArc} ${swingDir}" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="2,2"/>`;
        h += `<line x1="3" y1="${fh/2}" x2="3" y2="${swingDir}" stroke="#facc15" stroke-width="2"/>`;
        h += `<line x1="${fw - 3}" y1="${fh/2}" x2="${fw - 3}" y2="${swingDir}" stroke="#facc15" stroke-width="2"/>`;
        // Frame jambs
        h += `<rect x="0" y="-1" width="3" height="${fh + 2}" fill="#eab308"/>`;
        h += `<rect x="${fw-3}" y="-1" width="3" height="${fh + 2}" fill="#eab308"/>`;
    }

    if (isSel && !lockFixed) {
        h += renderRotationAndResizeHandles(fw, fh, ff.id, true);
    }
    h += `</g>`;
    return h;
}

function render2DWindowSVG(ff, fx, fy, fw, fh, isSel) {
    const rot = ff.rotation || 0;
    
    let h = `<g transform="translate(${fx + fw/2}, ${fy + fh/2}) rotate(${rot}) translate(${-fw/2}, ${-fh/2})" style="cursor:${(!lockFixed && curTool==='move')?'grab':'pointer'}" onclick="selectFixedClick(event, '${ff.id}')" onmousedown="startDragFixed(event, '${ff.id}')" ontouchstart="startDragFixed(event, '${ff.id}')">`;

    // Outer Frame
    h += `<rect x="0" y="0" width="${fw}" height="${fh}" fill="#0284c7" fill-opacity="0.2" stroke="${isSel ? '#fbbf24' : '#38bdf8'}" stroke-width="${isSel ? 2.5 : 1.5}" rx="2"/>`;

    // Glass Panes (Double Parallel Lines)
    h += `<line x1="4" y1="${fh*0.3}" x2="${fw - 4}" y2="${fh*0.3}" stroke="#38bdf8" stroke-width="2"/>`;
    h += `<line x1="4" y1="${fh*0.7}" x2="${fw - 4}" y2="${fh*0.7}" stroke="#38bdf8" stroke-width="2"/>`;
    // Center sash divider
    h += `<line x1="${fw/2}" y1="0" x2="${fw/2}" y2="${fh}" stroke="#38bdf8" stroke-width="2"/>`;
    // Wall Sill Endcaps
    h += `<rect x="-3" y="-1" width="3" height="${fh + 2}" fill="#38bdf8"/>`;
    h += `<rect x="${fw}" y="-1" width="3" height="${fh + 2}" fill="#38bdf8"/>`;

    h += `<text x="${fw/2}" y="${fh/2 + 3}" text-anchor="middle" fill="#e0f2fe" font-size="9" font-weight="700">${ff.name}</text>`;

    if (isSel && !lockFixed) {
        h += renderRotationAndResizeHandles(fw, fh, ff.id, false);
    }
    h += `</g>`;
    return h;
}

function create3DDoor(group, ff) {
    const doorGroup = new THREE.Group();
    const w = ff.w || 3;
    const h = 7; // standard 7ft door height
    const rot = (ff.rotation || 0) * (Math.PI / 180);
    const isDouble = (w >= 5);

    const frameMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.6 });
    const panelMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
    const brassMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8, roughness: 0.2 });

    const postGeo = new THREE.BoxGeometry(0.2, h, 0.4);
    const leftPost = new THREE.Mesh(postGeo, frameMat);
    leftPost.position.set(-w/2 + 0.1, h/2, 0);
    doorGroup.add(leftPost);

    const rightPost = new THREE.Mesh(postGeo, frameMat);
    rightPost.position.set(w/2 - 0.1, h/2, 0);
    doorGroup.add(rightPost);

    const topGeo = new THREE.BoxGeometry(w, 0.2, 0.4);
    const topBeam = new THREE.Mesh(topGeo, frameMat);
    topBeam.position.set(0, h - 0.1, 0);
    doorGroup.add(topBeam);

    if (!isDouble) {
        const panelW = w - 0.4;
        const panelGeo = new THREE.BoxGeometry(panelW, h - 0.2, 0.15);
        const panelMesh = new THREE.Mesh(panelGeo, panelMat);
        panelMesh.position.set(panelW / 2, (h - 0.2) / 2, 0);
        
        const hingeGroup = new THREE.Group();
        hingeGroup.position.set(-w/2 + 0.2, 0, 0);
        hingeGroup.rotation.y = Math.PI / 4; // 45 deg open swing
        hingeGroup.add(panelMesh);

        const handleGeo = new THREE.SphereGeometry(0.12, 12, 12);
        const handleMesh = new THREE.Mesh(handleGeo, brassMat);
        handleMesh.position.set(panelW - 0.3, h / 2, 0.12);
        hingeGroup.add(handleMesh);

        doorGroup.add(hingeGroup);
    } else {
        const halfW = (w - 0.4) / 2;
        const panelGeo = new THREE.BoxGeometry(halfW, h - 0.2, 0.15);
        
        const leftLeaf = new THREE.Mesh(panelGeo, panelMat);
        leftLeaf.position.set(halfW / 2, (h - 0.2) / 2, 0);
        const leftHinge = new THREE.Group();
        leftHinge.position.set(-w/2 + 0.2, 0, 0);
        leftHinge.rotation.y = Math.PI / 4;
        leftHinge.add(leftLeaf);
        doorGroup.add(leftHinge);

        const rightLeaf = new THREE.Mesh(panelGeo, panelMat);
        rightLeaf.position.set(-halfW / 2, (h - 0.2) / 2, 0);
        const rightHinge = new THREE.Group();
        rightHinge.position.set(w/2 - 0.2, 0, 0);
        rightHinge.rotation.y = -Math.PI / 4;
        rightHinge.add(rightLeaf);
        doorGroup.add(rightHinge);
    }

    doorGroup.position.set(ff.x + (ff.w || 3) / 2, 0, ff.y + (ff.h || 0.5) / 2);
    doorGroup.rotation.y = -rot;
    group.add(doorGroup);
}

function create3DWindow(group, ff) {
    const winGroup = new THREE.Group();
    const w = ff.w || 4;
    const winH = 4;
    const sillH = 3;
    const rot = (ff.rotation || 0) * (Math.PI / 180);

    const frameMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, opacity: 0.4, transparent: true, roughness: 0.1 });

    const frameGeo = new THREE.BoxGeometry(w, winH, 0.3);
    const frameMesh = new THREE.Mesh(frameGeo, frameMat);
    frameMesh.position.set(0, sillH + winH / 2, 0);
    winGroup.add(frameMesh);

    const glassGeo = new THREE.BoxGeometry(w - 0.4, winH - 0.4, 0.08);
    const glassMesh = new THREE.Mesh(glassGeo, glassMat);
    glassMesh.position.set(0, sillH + winH / 2, 0);
    winGroup.add(glassMesh);

    winGroup.position.set(ff.x + (ff.w || 4) / 2, 0, ff.y + (ff.h || 0.5) / 2);
    winGroup.rotation.y = -rot;
    group.add(winGroup);
}

function render2DStaircaseSVG(x, y, w, h, isSel) {
    const steps = 8;
    const landingW = Math.min(3.5 * S, w * 0.3); // West Mid-Landing width
    const flightL = w - landingW; // East-West flight length
    const stepW = flightL / steps; // tread width per step
    const gap = 0.4 * S; // central well gap (East-West)
    const flightH = (h - gap) / 2; // North & South flight thickness

    let svgStr = `<g style="cursor:pointer" onclick="selectFixedClick(event, 'stairs')">
        <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#1e293b" stroke="${isSel ? 'var(--accent)' : '#475569'}" stroke-width="${isSel ? 2.5 : 1.5}" rx="4"/>`;

    // Mid-Landing Box at West (Left end)
    svgStr += `<rect x="${x}" y="${y}" width="${landingW}" height="${h}" fill="rgba(51, 65, 85, 0.7)" stroke="#64748b" stroke-width="1"/>`;
    svgStr += `<text x="${x + landingW/2}" y="${y + h/2 + 3}" text-anchor="middle" fill="#cbd5e1" font-size="9" font-weight="600" transform="rotate(-90, ${x + landingW/2}, ${y + h/2})">Mid-Landing (5')</text>`;

    // Central Stairwell Gap Divider
    svgStr += `<rect x="${x + landingW}" y="${y + flightH}" width="${flightL}" height="${gap}" fill="#0f172a" stroke="#475569" stroke-width="0.5"/>`;

    // Flight 1 Step Lines (South/Bottom Flight - Ascending East to West)
    for (let i = 0; i <= steps; i++) {
        const sx = x + landingW + i * stepW;
        svgStr += `<line x1="${sx}" y1="${y + h - flightH}" x2="${sx}" y2="${y + h}" stroke="#64748b" stroke-width="1"/>`;
    }

    // Flight 2 Step Lines (North/Top Flight - Ascending West to East)
    for (let i = 0; i <= steps; i++) {
        const sx = x + landingW + i * stepW;
        svgStr += `<line x1="${sx}" y1="${y}" x2="${sx}" y2="${y + flightH}" stroke="#64748b" stroke-width="1"/>`;
    }

    // Clockwise U-Turn Arrow Path: Start at East-South -> West to Landing -> U-Turn -> East-North
    const arrowStartY = y + h - flightH / 2;
    const arrowEndY = y + flightH / 2;
    const arrowStartX = x + w - 12;
    const arrowLandX = x + landingW / 2;
    const arcR = (arrowStartY - arrowEndY) / 2;

    svgStr += `<path d="M ${arrowStartX} ${arrowStartY} L ${arrowLandX} ${arrowStartY} A ${arcR} ${arcR} 0 0 1 ${arrowLandX} ${arrowEndY} L ${arrowStartX - 10} ${arrowEndY}" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="4,2"/>`;
    svgStr += `<polygon points="${arrowStartX},${arrowEndY} ${arrowStartX - 8},${arrowEndY - 4} ${arrowStartX - 8},${arrowEndY + 4}" fill="#facc15"/>`;

    svgStr += `<text x="${arrowStartX - 35}" y="${arrowStartY + 3}" text-anchor="middle" fill="#facc15" font-size="9" font-weight="700">UP ↖ (East)</text>`;
    svgStr += `</g>`;
    return svgStr;
}

function createTubeBetweenPoints(group, x1, y1, z1, x2, y2, z2, radius, mat) {
    const p1 = new THREE.Vector3(x1, y1, z1);
    const p2 = new THREE.Vector3(x2, y2, z2);
    const dist = p1.distanceTo(p2);
    if (dist < 0.001) return;
    const geo = new THREE.CylinderGeometry(radius, radius, dist, 8);
    const mesh = new THREE.Mesh(geo, mat);
    const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
    mesh.position.copy(mid);
    
    const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    mesh.castShadow = true;
    group.add(mesh);
    return mesh;
}

function create3DStairs(group, x, y, w, h) {
    // Architectural U-Shaped Staircase matching User Hand-Drawn Blueprint
    // Flights run East-West (along w=12ft), divided North-South (along h=7ft).
    // Entrance: Starts at East (x + w), ascends Westwards (towards x) on South/Bottom half.
    // Mid-Landing: Situated at West end (x to x + landingW), height = 5ft.
    // Return Flight: Ascends Eastwards (towards x + w) on North/Top half up to next floor (10ft).

    const stepsPerFlight = 8;
    const totalHeight = 10; // floor-to-floor height
    const landingHeight = totalHeight / 2; // 5ft mid-landing
    const gap = 0.5; // central stairwell gap
    const flightH = (h - gap) / 2; // height of each flight (North-South thickness)
    const landingW = Math.min(3.5, w * 0.35); // landing width at West end
    const flightL = w - landingW; // length of flight (East-West direction)
    const stepW = flightL / stepsPerFlight; // tread length along X
    const stepH = landingHeight / stepsPerFlight; // riser height

    // Materials
    const treadMat = new THREE.MeshStandardMaterial({ color: 0xc084fc, roughness: 0.3 }); // Polished step tread
    const riserMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 }); // Riser face
    const soffitMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 }); // Concrete soffit slab
    const railMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.6, roughness: 0.2 }); // Gold/Brass Handrail
    const balusterMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.3, roughness: 0.4 }); // White Balusters

    const treadThick = 0.12;
    const treadNosing = 0.1;
    const railH = 2.7; // Handrail height above steps

    // 1. FLIGHT 1 (South/Bottom Flight: Ascending East -> West)
    const f1Y = y + h - flightH; // South half
    for (let i = 0; i < stepsPerFlight; i++) {
        const curX = x + w - (i + 1) * stepW;
        const curH = i * stepH;

        // Tread Board
        const tGeo = new THREE.BoxGeometry(stepW + treadNosing, treadThick, flightH);
        const tMesh = new THREE.Mesh(tGeo, treadMat);
        tMesh.position.set(curX + stepW / 2, curH + stepH, f1Y + flightH / 2);
        tMesh.castShadow = true;
        group.add(tMesh);

        // Riser Face
        const rGeo = new THREE.BoxGeometry(0.08, stepH, flightH);
        const rMesh = new THREE.Mesh(rGeo, riserMat);
        rMesh.position.set(curX + stepW, curH + stepH / 2, f1Y + flightH / 2);
        rMesh.castShadow = true;
        group.add(rMesh);

        // Vertical Baluster Post (Inner edge along gap)
        if (i % 2 === 0) {
            const bGeo = new THREE.CylinderGeometry(0.03, 0.03, railH);
            const bMesh = new THREE.Mesh(bGeo, balusterMat);
            bMesh.position.set(curX + stepW / 2, curH + stepH + railH / 2, f1Y + 0.1);
            bMesh.castShadow = true;
            group.add(bMesh);
        }
    }

    // Flight 1 Under-Slanted Concrete Soffit Support Slab
    const soffit1Len = Math.hypot(flightL, landingHeight);
    const soffit1Geo = new THREE.BoxGeometry(soffit1Len, 0.3, flightH);
    const soffit1Mesh = new THREE.Mesh(soffit1Geo, soffitMat);
    const angle1 = Math.atan2(landingHeight, flightL);
    soffit1Mesh.position.set(x + landingW + flightL / 2, landingHeight / 2 - 0.2, f1Y + flightH / 2);
    soffit1Mesh.rotation.z = angle1;
    soffit1Mesh.castShadow = true;
    group.add(soffit1Mesh);

    // Flight 1 Handrail (Inner edge along central gap)
    createTubeBetweenPoints(
        group,
        x + w, stepH + railH, f1Y + 0.1,
        x + landingW, landingHeight + railH, f1Y + 0.1,
        0.06, railMat
    );

    // 2. MID-LANDING AT WEST END (x to x + landingW, spanning full height h)
    const landGeo = new THREE.BoxGeometry(landingW, 0.3, h);
    const landMesh = new THREE.Mesh(landGeo, treadMat);
    landMesh.position.set(x + landingW / 2, landingHeight, y + h / 2);
    landMesh.castShadow = true;
    group.add(landMesh);

    // Landing Handrail Curve connecting Flight 1 to Flight 2 at West end
    createTubeBetweenPoints(
        group,
        x + landingW, landingHeight + railH, f1Y + 0.1,
        x + landingW, landingHeight + railH, y + flightH - 0.1,
        0.06, railMat
    );

    // 3. FLIGHT 2 (North/Top Flight: Ascending West -> East)
    const f2Y = y; // North half
    for (let i = 0; i < stepsPerFlight; i++) {
        const curX = x + landingW + i * stepW;
        const curH = landingHeight + i * stepH;

        // Tread Board
        const tGeo = new THREE.BoxGeometry(stepW + treadNosing, treadThick, flightH);
        const tMesh = new THREE.Mesh(tGeo, treadMat);
        tMesh.position.set(curX + stepW / 2, curH + stepH, f2Y + flightH / 2);
        tMesh.castShadow = true;
        group.add(tMesh);

        // Riser Face
        const rGeo = new THREE.BoxGeometry(0.08, stepH, flightH);
        const rMesh = new THREE.Mesh(rGeo, riserMat);
        rMesh.position.set(curX, curH + stepH / 2, f2Y + flightH / 2);
        rMesh.castShadow = true;
        group.add(rMesh);

        // Vertical Baluster Post (Inner edge along gap)
        if (i % 2 === 0) {
            const bGeo = new THREE.CylinderGeometry(0.03, 0.03, railH);
            const bMesh = new THREE.Mesh(bGeo, balusterMat);
            bMesh.position.set(curX + stepW / 2, curH + stepH + railH / 2, f2Y + flightH - 0.1);
            bMesh.castShadow = true;
            group.add(bMesh);
        }
    }

    // Flight 2 Under-Slanted Soffit Support Slab
    const soffit2Geo = new THREE.BoxGeometry(soffit1Len, 0.3, flightH);
    const soffit2Mesh = new THREE.Mesh(soffit2Geo, soffitMat);
    soffit2Mesh.position.set(x + landingW + flightL / 2, landingHeight + landingHeight / 2 - 0.2, f2Y + flightH / 2);
    soffit2Mesh.rotation.z = -angle1;
    soffit2Mesh.castShadow = true;
    group.add(soffit2Mesh);

    // Flight 2 Handrail (Inner edge along central gap)
    createTubeBetweenPoints(
        group,
        x + landingW, landingHeight + railH, f2Y + flightH - 0.1,
        x + w, totalHeight + railH, f2Y + flightH - 0.1,
        0.06, railMat
    );
}

function animate3D() {
    animReq3D = requestAnimationFrame(animate3D);
    explodeAmount += (targetExplode - explodeAmount) * 0.1;

    floorConfig.forEach((fConf, idx) => {
        const grp = floor3DGroups[fConf.id];
        if (!grp) return;
        const baseHeight = idx * 10;
        if (view3DFloor === 'all') {
            grp.position.y = baseHeight + idx * explodeAmount * 15;
            grp.visible = true;
        } else {
            grp.position.y = 0;
            grp.visible = (fConf.id === view3DFloor);
        }
    });

    if (controls3D) {
        controls3D.autoRotate = isAutoRotate;
        controls3D.autoRotateSpeed = 2.0;
        controls3D.update();
    }

    if (renderer3D && scene3D && camera3D) {
        renderer3D.render(scene3D, camera3D);
    }
}

function toggle3DExplode() {
    isExploded = !isExploded;
    targetExplode = isExploded ? 1 : 0;
    document.getElementById('btnExplode').textContent = isExploded ? '🏢 Collapse' : '💥 Explode';
}

function toggle3DAutoRotate() {
    isAutoRotate = !isAutoRotate;
    document.getElementById('btnRotate').textContent = isAutoRotate ? '⏸️ Pause' : '🔄 Rotate';
}

// Start Application
initUI();
</script>
